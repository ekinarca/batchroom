[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "batchroom"
version = "0.5.0"
description = "Self-hosted AI media processing server: batch background removal, resize, convert, preset packs. No meters, no quotas, no cloud."
readme = "README.md"
requires-python = ">=3.11"
# MIT core; src/batchroom/pro is source-available (LICENSE-PRO)
license = { text = "MIT AND LicenseRef-Batchroom-Pro" }
authors = [{ name = "Batchroom contributors" }]
keywords = [
  "self-hosted",
  "background-removal",
  "image-processing",
  "batch",
  "onnx",
  "docker",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "Pillow>=10.3",
  "pillow-heif>=0.16",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "onnx>=1.16",
  # Starlette >= 1.0's TestClient runs on httpx2 (plain httpx is deprecated there)
  "httpx2>=2.13",
]

[project.scripts]
batchroom = "batchroom.cli:main"

[project.urls]
Homepage = "https://batchroom.app"
Repository = "https://github.com/ekinarca/batchroom"
Documentation = "https://github.com/ekinarca/batchroom#readme"
Changelog = "https://github.com/ekinarca/batchroom/blob/main/CHANGELOG.md"
Issues = "https://github.com/ekinarca/batchroom/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
batchroom = [
  "ui/*",
  "recipes/*.yaml",
  "i18n/strings/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:multipart"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108", "SIM117"]
