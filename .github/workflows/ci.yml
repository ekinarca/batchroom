name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: i18n catalogs complete
        run: python scripts/verify_i18n.py
      - name: Tests (unit + golden images)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true          # make the image available to `docker run` below
          tags: batchroom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name br -p 5151:5151 batchroom:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5151/api/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            sleep 1
            if [ "$i" = "30" ]; then echo "server never became healthy"; docker logs br; exit 1; fi
          done
          curl -fsS http://127.0.0.1:5151/api/recipes | grep -q ecom-packshot
          curl -fsS http://127.0.0.1:5151/api/i18n | grep -q '"ar"'
          docker rm -f br
