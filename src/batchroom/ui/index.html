<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Batchroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101113'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23e5484d' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23e5484d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="app" hidden>
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <strong>Batchroom</strong>
        <small id="brand-version"></small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="user-box"></div>
      <button id="tour-link" type="button" class="btn small ghost"></button>
      <select id="lang-select" aria-label="Language"></select>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="auth-gate" hidden>
  <form id="auth-form" class="panel auth-panel">
    <span class="brand-mark big" aria-hidden="true"></span>
    <p id="auth-prompt"></p>
    <input id="auth-key" type="password" autocomplete="off">
    <button type="submit" class="btn sig" id="auth-submit"></button>
    <p class="auth-error" id="auth-error" hidden></p>
  </form>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script src="/assets/app.js"></script>
</body>
</html>
